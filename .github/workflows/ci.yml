name: Golden Source CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: goldensource
          POSTGRES_USER: golden
          POSTGRES_PASSWORD: golden123

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U golden -d goldensource"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-source-service-${{ github.sha }}
          path: target/golden-source-service-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Build Docker image
        run: |
          docker build \
            -t golden-source-service:${{ github.sha }} \
            .
